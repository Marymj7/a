<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animation, Transitions and Transforms</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: sans-serif;
            background-color: #f5f5f5;
        }

        .btn {
            border: 2px solid tomato;
            background: none;
            color: tomato;
            padding: 20px 40px;
            font-size: 25px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.5s;
            position: relative;
            overflow: hidden;
            border-radius: 5px;
        }

        .btn:hover {
            color: white;
        }

        .btn:before {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%;
            background: tomato;
            z-index: -1;
            border-radius: 50% 50% 0 0;
            transition: all 0.5s;
        }

        .btn:hover:before {
            height: 190%;
        }

        .container {
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
        }

        .instructions {
            margin-top: 30px;
            color: #666;
            max-width: 500px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Efeito Hover com CSS</h1>
        <button class="btn">
            <i class="fas fa-hand-pointer"></i> Passe o mouse
        </button>
        <div class="instructions">
            <p>Este botão demonstra um efeito de hover onde o fundo se expande de baixo para cima quando você passa o mouse sobre ele.</p>
            <p>O efeito é criado usando pseudo-elementos e transições CSS.</p>
        </div>
    </div>
</body>
</html>
